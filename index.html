    $('#cl_g').onclick=async()=>{const s=($('#cl_s').value||'').toLowerCase().replace(/[^a-z0-9-]/g,'');if(!s){$('#cl_m').textContent='Escribe un identificador.';return}
      $('#cl_m').textContent='Guardando...';
      try{const cc=col(),fo=cfgToFotos(cc),F2={...cc};['foto','fotoSobre','fotoLugar','fotoLugar2','fondos','galeria'].forEach(k=>{delete F2[k]});
        const r=fdb.collection('invitaciones').doc(s),ex=await r.collection('fotos').get(),b=fdb.batch();
        b.set(r,{owner:fau.currentUser.uid,cfg:F2,actualizado:Date.now()},{merge:true});
        ex.forEach(z=>{if(!fo[z.id])b.delete(z.ref)});Object.entries(fo).forEach(([k,u])=>b.set(r.collection('fotos').doc(k),{d:u}));
        await b.commit();$('#cl_m').textContent='Guardado. Enlace: '+ur()+'?e='+s+'   |   Enlace con forma de carpeta (opcional, requiere 404.html): '+ur()+'evento/'+s}catch(e){$('#cl_m').textContent='Error: '+e.message}}}
  fau.onAuthStateChanged(u=>u?lista():login());
}
</script>
</body>
